apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: services-frontend-service:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Never
        env:
            - name: QUOTES_SERVICE_URL
              value: "http://quotes-svc-service.default.svc.cluster.local:8000"
