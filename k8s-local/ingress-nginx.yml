apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fe-be-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /be(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quotes-svc-service
                port:
                  number: 8000
          - path: /fe(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000